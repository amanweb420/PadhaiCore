<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chapter 1 Objective - PadhaiCore</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050816;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .back {
      display: inline-block;
      margin: 10px 0 20px;
      padding: 10px 18px;
      border-radius: 10px;
      background: #111a35;
      color: white;
      text-decoration: none;
      border: 1px solid #28345c;
    }

    .header {
      text-align: center;
      padding: 10px 10px 25px;
    }

    .header .icon {
      font-size: 45px;
    }

    .header h1 {
      margin-top: 8px;
      font-size: 28px;
      background: linear-gradient(90deg, #22c55e, #00d4ff, #8b5cf6);
      -webkit-background-clip: text;
      color: transparent;
    }

    .header p {
      margin-top: 8px;
      color: #b9c2d0;
      font-size: 14px;
    }

    .content-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .content-page {
      background: #111a35;
      padding: 10px;
      border-radius: 15px;
      border: 1px solid #22c55e;
    }

    .content-page img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }

    .page-title {
      text-align: center;
      color: #86efac;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .empty {
      text-align: center;
      padding: 35px 15px;
      border-radius: 15px;
      background: #111a35;
      border: 1px dashed #394b78;
      color: #9aa6bd;
      line-height: 1.6;
    }

    .footer {
      text-align: center;
      margin: 30px 0 10px;
      color: #707b96;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- BACK -->
    <a href="class12-physics.html" class="back">
      ← Class 12 Physics
    </a>


    <!-- HEADER -->
    <div class="header">

      <div class="icon">🎯</div>

      <h1>Chapter 1 Objective</h1>

      <p>
        Electric Charges and Fields
      </p>

    </div>


    <!-- OBJECTIVE IMAGES -->

    <div class="content-container" id="contentContainer">
    </div>


    <div class="footer">
      ⭐ PadhaiCore • Chapter 1 Physics Objective
    </div>

  </div>


  <script>

    /* =========================================
       🎯 OBJECTIVE IMAGES

       👉 नई image जोड़ने के लिए
       सिर्फ नीचे वाली list में नाम जोड़ें।
       ========================================= */

    const objectiveImages = [
      "page1.jpg"
    ];


    const contentContainer =
      document.getElementById("contentContainer");


    objectiveImages.forEach((image, index) => {

      const page = document.createElement("div");

      page.className = "content-page";


      page.innerHTML = `

        <div class="page-title">
          Objective Page ${index + 1}
        </div>

        <img
          src="assets/physics/chapter1/objective/${image}"
          alt="Chapter 1 Objective Page ${index + 1}"
        >

      `;


      contentContainer.appendChild(page);

    });

  </script>

</body>
</html>
