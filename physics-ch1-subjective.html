<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chapter 1 Subjective - PadhaiCore</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050816;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      padding: 10px 18px;
      border-radius: 10px;
      background: #111a35;
      color: white;
      text-decoration: none;
      border: 1px solid #28345c;
    }

    .header {
      text-align: center;
      padding: 20px 10px 30px;
    }

    .icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 34px;
      background: linear-gradient(90deg, #a855f7, #22d3ee);
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      color: #b9c2d0;
      font-size: 16px;
    }

    .notes-container {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .note-page {
      padding: 12px;
      border-radius: 20px;
      background: #111a35;
      border: 1px solid #8b5cf6;
      overflow: hidden;
    }

    .page-title {
      text-align: center;
      color: #a78bfa;
      font-size: 17px;
      padding: 8px;
    }

    .note-page img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
      background: white;
    }

    .footer {
      text-align: center;
      color: #68738a;
      margin-top: 35px;
      padding-bottom: 20px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .header h1 {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <a href="class12-physics.html" class="back">
      ← Class 12 Physics
    </a>

    <div class="header">

      <div class="icon">✍️</div>

      <h1>Chapter 1 Subjective</h1>

      <p>Electric Charges and Fields</p>

    </div>


    <!-- SUBJECTIVE IMAGES -->

    <div class="notes-container" id="subjectiveContainer">
    </div>


    <div class="footer">
      ⭐ PadhaiCore • Chapter 1 Physics Subjective
    </div>

  </div>


  <script>

    // ==========================================
    // ✍️ SUBJECTIVE IMAGES
    // नई image जोड़ने के लिए सिर्फ नीचे वाली list बदलें
    // ==========================================

    const subjectiveImages = [
      "page1.jpg"
    ];


    const subjectiveContainer =
      document.getElementById("subjectiveContainer");


    subjectiveImages.forEach((image, index) => {

      const page = document.createElement("div");

      page.className = "note-page";


      page.innerHTML = `
        <div class="page-title">
          Subjective Page ${index + 1}
        </div>

        <img
          src="assets/physics/chapter1/subjective/${image}"
          alt="Chapter 1 Subjective Page ${index + 1}"
        >
      `;


      subjectiveContainer.appendChild(page);

    });

  </script>

</body>
</html>
