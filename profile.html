<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile - PadhaiCore</title>
  <link rel="stylesheet" href="profile.css">
</head>

<body>

  <h1>Student Profile</h1>
  <button class="edit-profile-btn" onclick="editProfile()">✏️ Edit Profile</button>

<div class="profile-form">

  <h2>📝 Personal & Academic Information</h2>

  <label>Student Name</label>
  <input type="text" id="profileName" placeholder="Enter your name">

  <label>Class</label>
  <input type="text" id="profileClass" placeholder="Enter your class">

  <label>Stream</label>
  <input type="text" id="profileStream" placeholder="Science / Commerce / Arts">

  <label>Board</label>
  <input type="text" id="profileBoard" placeholder="Bihar Board / CBSE / ICSE">

  <label>School / College</label>
  <input type="text" id="profileSchool" placeholder="Enter school name">

  <label>Main Goal</label>
  <input type="text" id="profileGoal" placeholder="Board / JEE / CUET / Other">

  <button class="save-profile-btn" type="button">
    💾 Save Profile
  </button>

</div>

</body>
</html>
