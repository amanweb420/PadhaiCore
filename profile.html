<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile - PadhaiCore</title>
  <link rel="stylesheet" href="profile.css">
</head>

<body>

  <h1>Student Profile</h1>
  <button class="edit-profile-btn" onclick="editProfile()">✏️ Edit Profile</button>

<div class="profile-form">

  <h2>📝 Personal & Academic Information</h2>

  <label>Student Name</label>
  <input type="text" id="profileName" placeholder="Enter your name">

  <label>Class</label>
  <input type="text" id="profileClass" placeholder="Enter your class">

  <label>Stream</label>
  <input type="text" id="profileStream" placeholder="Science / Commerce / Arts">

  <label>Board</label>
  <input type="text" id="profileBoard" placeholder="Bihar Board / CBSE / ICSE">

  <label>School / College</label>
  <input type="text" id="profileSchool" placeholder="Enter school name">

  <label>Main Goal</label>
  <input type="text" id="profileGoal" placeholder="Board / JEE / CUET / Other">

  <button class="save-profile-btn" type="button" onclick="saveProfile()">
  💾 Save Profile
  </button>
  <hr>
  <div id="routineDisplay"></div>
  
  <h2>📅 Daily Study Routine</h2>

  <label>Study Time</label>
  <input type="time" id="routineTime">

  <label>Subject</label>
  <input type="text" id="routineSubject" placeholder="Example: Physics">

  <label>What to Study</label>
  <input type="text" id="routineTask" placeholder="Example: Electrostatics">

  <button class="save-profile-btn" type="button" onclick="saveRoutine()">
    💾 Save Routine
  </button>
</div>
<script src="script.js?v=2"></script>
</body>
</html>
