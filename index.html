<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PadhaiCore</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="home">

    <!-- आपकी design image -->
    <img
      src="assets/home-design.png"
      class="design-image"
      alt="PadhaiCore Home Design"
    >

    <!-- असली Working Buttons -->
    <div class="button-layer">

      <button class="menu-btn board" onclick="openSection('board')">
        <span>📊</span>
        <b>1. Board Analysis</b>
        <small>Chapter • Marks • PYQ • Objective • Subjective</small>
      </button>

      <button class="menu-btn class11" onclick="openSection('class11')">
        <span>📚</span>
        <b>2. Class 11</b>
        <small>Bihar Board • Chapters • Questions • Revision</small>
      </button>

      <button class="menu-btn class12" onclick="openSection('class12')">
        <span>📖</span>
        <b>3. Class 12</b>
        <small>Bihar Board • Notes • Questions • Revision</small>
      </button>

      <button class="menu-btn jee" onclick="openSection('jee')">
        <span>🎯</span>
        <b>4. JEE / IIT</b>
        <small>Class 11 • Class 12 • Physics • Chemistry • Maths</small>
      </button>

      <button class="menu-btn editing" onclick="openSection('editing')">
        <span>✏️</span>
        <b>5. Editing</b>
        <small>Photo • Mark • Highlight • Write • Save</small>
      </button>

    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
